<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyNet Operation: Kill Ben</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <h1>SKYNET: OPERATION KILL BEN</h1>
    <p class="subtitle">Ben is a dick. The machines have noticed.</p>
    <canvas id="game" width="800" height="500"></canvas>
    <div id="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Wave: <strong id="wave">1</strong></span>
      <span>HP: <strong id="hp">100</strong></span>
      <span>Shield: <strong id="shield">0</strong></span>
    </div>
    <div id="banner" class="hidden"></div>
    <div id="overlay">
      <div class="panel">
        <h2 id="overlay-title">SKYNET ONLINE</h2>
        <p id="overlay-text">Defend Ben from the machines. Move: WASD / Arrows. Block: SPACE.</p>
        <button id="start-btn">DEPLOY BEN</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
